name: Build Windows Dist

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - cursor/**
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe with PyInstaller
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Write-Host "Building media-monitor v$version"
          pyinstaller --noconfirm --clean --onefile --name media-monitor `
            --distpath dist `
            --workpath build `
            main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare dist folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\reports | Out-Null
          New-Item -ItemType File -Force -Path dist\reports\.gitkeep | Out-Null
          Copy-Item -Force sites.example.txt, words.example.txt, settings.example.txt, exclude.example.txt dist\
          if (Test-Path VERSION) { Copy-Item -Force VERSION dist\ }

          # ASCII filenames avoid zip encoding issues with Cyrillic on Windows
          $instrTxt = Get-ChildItem -File -Filter "*.txt" | Where-Object {
            $_.Name -eq ([string]([char]0x0418) + [char]0x041D + [char]0x0421 + [char]0x0422 + [char]0x0420 + [char]0x0423 + [char]0x041A + [char]0x0426 + [char]0x0418 + [char]0x042F + ".txt")
          } | Select-Object -First 1
          $instrDocx = Get-ChildItem -File -Filter "*.docx" | Select-Object -First 1
          if ($instrTxt) { Copy-Item -LiteralPath $instrTxt.FullName -Destination dist\INSTRUCTION.txt -Force }
          if ($instrDocx) { Copy-Item -LiteralPath $instrDocx.FullName -Destination dist\INSTRUCTION.docx -Force }

          foreach ($name in @("sites", "words", "settings", "exclude")) {
            $target = "dist\$name.txt"
            if (-not (Test-Path $target)) {
              Copy-Item -Force "$name.example.txt" $target
              Write-Host "Created $target"
            }
          }

          if (Test-Path dist\setting.txt) { Remove-Item -Force dist\setting.txt }

          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Zip dist
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zipName = "media-monitor-v$version-windows.zip"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = Join-Path (Get-Location) $zipName
          $distPath = Join-Path (Get-Location) "dist"
          if (Test-Path $zipPath) { Remove-Item -Force $zipPath }
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $distPath,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false
          )
          Write-Host "Created $zipName"
          Get-Item $zipName | Format-List Name, Length, FullName

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-monitor-windows
          path: media-monitor-v*-windows.zip
          if-no-files-found: error
