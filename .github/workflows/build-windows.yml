name: Build Windows Dist

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - cursor/**
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe with PyInstaller (onedir — fast startup)
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $exeName = "media-monitor-v$version"
          Write-Host "Building $exeName (onedir + windowed GUI)"
          # onedir: no multi-minute onefile extraction freeze on every launch
          pyinstaller --noconfirm --clean --onedir --windowed --name $exeName `
            --distpath dist `
            --workpath build `
            --contents-directory _internal `
            --add-data "certs;certs" `
            --hidden-import gui `
            main.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Flatten: move app folder contents to dist\ so configs sit next to exe
          $appDir = Join-Path dist $exeName
          if (Test-Path $appDir) {
            Get-ChildItem $appDir | ForEach-Object {
              $dest = Join-Path dist $_.Name
              if (Test-Path $dest) { Remove-Item -Recurse -Force $dest }
              Move-Item -Force $_.FullName $dest
            }
            Remove-Item -Recurse -Force $appDir
          }
          if (Test-Path dist\media-monitor.exe) {
            Remove-Item -Force dist\media-monitor.exe
          }

      - name: Prepare dist folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\reports | Out-Null
          Copy-Item -Force sites.example.txt, words.example.txt, settings.example.txt, exclude.example.txt dist\

          # ASCII names always work; Cyrillic names packed later with UTF-8 zip flag
          if (Test-Path ИНСТРУКЦИЯ.txt) {
            Copy-Item -Force ИНСТРУКЦИЯ.txt dist\INSTRUCTION.txt
            Copy-Item -Force ИНСТРУКЦИЯ.txt dist\ИНСТРУКЦИЯ.txt
          }
          if (Test-Path ИНСТРУКЦИЯ.docx) {
            Copy-Item -Force ИНСТРУКЦИЯ.docx dist\INSTRUCTION.docx
            Copy-Item -Force ИНСТРУКЦИЯ.docx dist\ИНСТРУКЦИЯ.docx
          }
          if (Test-Path VERSION) { Copy-Item -Force VERSION dist\ }

          foreach ($name in @("sites", "words", "settings", "exclude")) {
            $target = "dist\$name.txt"
            if (-not (Test-Path $target)) {
              Copy-Item -Force "$name.example.txt" $target
              Write-Host "Created $target"
            }
          }

          if (Test-Path dist\setting.txt) {
            Remove-Item -Force dist\setting.txt
          }

          Get-ChildItem dist | Format-Table Name, Length

      - name: Zip dist (UTF-8 filenames)
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $zipName = "media-monitor-v$version-windows.zip"
          python pack_windows_zip.py dist $zipName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item $zipName | Format-List Name, Length, FullName

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-monitor-windows
          path: media-monitor-v*-windows.zip
          if-no-files-found: error

      - name: Upload dist folder artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-monitor-windows-dist
          path: dist/
          if-no-files-found: error
